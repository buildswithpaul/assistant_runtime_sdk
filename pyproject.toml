[project]
name = "assistant_runtime_sdk"
version = "1.0.1"
description = "Python SDK for FAC Cloud - the Assistant Runtime AI assistant backend"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "Paul Clinton"}
]
keywords = ["frappe", "ai", "assistant", "llm", "mcp", "anthropic", "openai", "streaming"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
async = [
    "aiohttp>=3.8.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpserver>=1.0.0",
    "ruff>=0.1.0",
]
all = [
    "assistant_runtime_sdk[async,dev]",
]

[project.urls]
Homepage = "https://github.com/buildswithpaul/assistant_runtime_sdk"
Documentation = "https://github.com/buildswithpaul/assistant_runtime_sdk#readme"
Repository = "https://github.com/buildswithpaul/assistant_runtime_sdk"
Issues = "https://github.com/buildswithpaul/assistant_runtime_sdk/issues"

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "assistant_runtime_sdk"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501"]  # Line length handled separately

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
